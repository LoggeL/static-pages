<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset=".6" stop-color="#0e1030"/>
      <stop offset="1" stop-color="#081a2a"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" x2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset=".5" stop-color="#2fd3a0"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffd84d" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffd84d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="22" patternUnits="userSpaceOnUse" x="560" y="200">
      <path d="M32 0H0V22" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="plot"><rect x="400" y="0" width="400" height="450"/></clipPath>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="400" width="400" height="450" fill="url(#grid)"/>
  <g clip-path="url(#plot)">
    <path d="M400 200H792" stroke="#cfd6ff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M792 200l-10-5v10z" fill="#cfd6ff" fill-opacity=".55"/>
    <path d="M560 440V8" stroke="#cfd6ff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M560 8l-5 10h10z" fill="#cfd6ff" fill-opacity=".55"/>
    <path d="M457.6 9.9Q592 786.1 726.4 9.9" fill="none" stroke="url(#curve)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="496" cy="200" r="30" fill="url(#glow)"/>
    <circle cx="688" cy="200" r="30" fill="url(#glow)"/>
    <circle cx="496" cy="200" r="7" fill="#fff"/>
    <circle cx="688" cy="200" r="7" fill="#fff"/>
    <text x="496" y="236" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">−2</text>
    <text x="688" y="236" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">4</text>
    <circle cx="592" cy="398" r="6" fill="#ff8a3d"/>
    <text x="606" y="428" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffb27a">S(1 | −9)</text>
  </g>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="48" y="74" font-size="15" font-weight="700" letter-spacing="2.5" fill="#a7b0ff">MATHE · KLASSE 9 · HÜ-TRAINING</text>
    <text x="46" y="138" font-size="50" font-weight="800" fill="#ffffff">Quadratische</text>
    <text x="46" y="192" font-size="50" font-weight="800" fill="#ffffff">Gleichungen</text>
    <text x="48" y="232" font-size="24" font-weight="600" fill="#ffd84d">drei Wege, ohne Formel</text>
    <g font-size="16" font-weight="700">
      <rect x="48" y="262" width="104" height="36" rx="18" fill="#4c8dff"/>
      <text x="100" y="286" text-anchor="middle" fill="#fff">Grafisch</text>
      <rect x="162" y="262" width="140" height="36" rx="18" fill="#17b386"/>
      <text x="232" y="286" text-anchor="middle" fill="#fff">Faktorisieren</text>
      <rect x="48" y="308" width="200" height="36" rx="18" fill="#ff7a1a"/>
      <text x="148" y="332" text-anchor="middle" fill="#fff">Quadr. Ergänzung</text>
    </g>
    <text x="48" y="398" font-size="26" font-weight="700" font-style="italic" fill="#e8ebff">x² − 2x − 8 = 0</text>
    <text x="236" y="398" font-size="26" font-weight="700" fill="#2fd3a0">⇒ L = {−2; 4}</text>
  </g>
</svg>
