[project]
name = "stem-stage"
version = "0.1.0"
description = "Interactive 3D multi-track stem mixer with hybrid Demucs separation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "demucs>=4.1.0",
    "torch>=2.5.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "yt-dlp>=2024.1.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
