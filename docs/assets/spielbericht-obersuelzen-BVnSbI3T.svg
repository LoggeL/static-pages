<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="35%" cy="42%" r="78%">
      <stop offset="0" stop-color="#172542" />
      <stop offset="1" stop-color="#07090f" />
    </radialGradient>
    <pattern id="turf" width="44" height="366" patternUnits="userSpaceOnUse">
      <rect width="22" height="366" fill="#14532d" />
      <rect x="22" width="22" height="366" fill="#166534" />
    </pattern>
    <marker id="goal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#4ade80" />
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Tactical 2D Pitch (Left) -->
  <g transform="translate(28 42)">
    <rect width="430" height="366" rx="14" fill="url(#turf)" stroke="rgba(255,255,255,0.22)" stroke-width="2" />
    <g stroke="rgba(255,255,255,0.38)" stroke-width="1.6" fill="none">
      <rect x="16" y="16" width="398" height="334" />
      <line x1="215" y1="16" x2="215" y2="350" />
      <circle cx="215" cy="183" r="44" />
      <circle cx="215" cy="183" r="2.5" fill="rgba(255,255,255,0.65)" />
      <!-- Left Box (SVO) -->
      <rect x="16" y="92" width="66" height="182" />
      <rect x="16" y="136" width="24" height="94" />
      <!-- Right Box (SVH) -->
      <rect x="348" y="92" width="66" height="182" />
      <rect x="390" y="136" width="24" height="94" />
    </g>

    <!-- Dashed tactical pass network -->
    <g stroke="rgba(250,204,21,0.45)" stroke-width="1.8" stroke-dasharray="5 4" fill="none">
      <line x1="112" y1="224" x2="188" y2="218" />
      <line x1="112" y1="138" x2="188" y2="146" />
      <line x1="188" y1="218" x2="262" y2="183" />
      <line x1="188" y1="146" x2="262" y2="183" />
      <line x1="262" y1="183" x2="334" y2="183" />
    </g>

    <!-- #5 Winning Goal Trajectory (28') -->
    <path d="M 118 134 Q 210 112 246 146" stroke="#facc15" stroke-width="2.2" stroke-dasharray="4 3" fill="none" />
    <path d="M 254 150 Q 332 146 398 176" stroke="#4ade80" stroke-width="3" fill="none" marker-end="url(#goal-arrow)" />

    <!-- SVO Player Nodes -->
    <g font-family="Arial, sans-serif" font-weight="800" font-size="11" text-anchor="middle">
      <!-- TW Schwarz -->
      <circle cx="38" cy="183" r="14" fill="#111827" stroke="#eab308" stroke-width="2.2" />
      <text x="38" y="187" fill="#ffffff">TW</text>
      <!-- Back 4 -->
      <circle cx="116" cy="64" r="13" fill="#facc15" stroke="#111827" stroke-width="2" />
      <text x="116" y="68" fill="#111827">3</text>
      <circle cx="112" cy="138" r="14" fill="#facc15" stroke="#4ade80" stroke-width="2.5" />
      <text x="112" y="142" fill="#111827">5</text>
      <circle cx="112" cy="224" r="13" fill="#facc15" stroke="#111827" stroke-width="2" />
      <text x="112" y="228" fill="#111827">4C</text>
      <circle cx="116" cy="300" r="13" fill="#facc15" stroke="#111827" stroke-width="2" />
      <text x="116" y="304" fill="#111827">20</text>
      <!-- Pivots -->
      <circle cx="188" cy="146" r="13" fill="#facc15" stroke="#111827" stroke-width="2" />
      <text x="188" y="150" fill="#111827">18</text>
      <circle cx="188" cy="218" r="13" fill="#facc15" stroke="#111827" stroke-width="2" />
      <text x="188" y="222" fill="#111827">22</text>
      <!-- Attacking line -->
      <circle cx="268" cy="70" r="13" fill="#facc15" stroke="#111827" stroke-width="2" />
      <text x="268" y="74" fill="#111827">10</text>
      <circle cx="262" cy="183" r="13" fill="#facc15" stroke="#111827" stroke-width="2" />
      <text x="262" y="187" fill="#111827">27</text>
      <circle cx="268" cy="294" r="13" fill="#facc15" stroke="#111827" stroke-width="2" />
      <text x="268" y="298" fill="#111827">47</text>
      <circle cx="334" cy="183" r="13" fill="#facc15" stroke="#111827" stroke-width="2" />
      <text x="334" y="187" fill="#111827">9</text>
    </g>
  </g>

  <!-- Right Column: Scoreboard + Top Ratings + Title -->
  <g transform="translate(484 42)" font-family="Arial, sans-serif">
    <!-- Scoreboard Card -->
    <rect width="288" height="92" rx="14" fill="#111827" stroke="#283548" stroke-width="1.5" />
    <text x="16" y="24" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1">BEZIRKSLIGA · 08.11.2026</text>
    <text x="16" y="57" font-size="25" font-weight="800" fill="#f3f4f6">SVH  <tspan fill="#60a5fa">1</tspan> : <tspan fill="#22c55e">2</tspan>  <tspan fill="#eab308">SVO</tspan></text>
    <text x="16" y="77" font-size="11" fill="#9ca3af">23' 0:1 (#22 FK) · 24' 1:1 · 28' 1:2 (#5)</text>

    <!-- Player Rating Bars -->
    <g transform="translate(0 110)">
      <rect width="288" height="178" rx="14" fill="#111827" stroke="#283548" stroke-width="1.5" />
      <text x="16" y="24" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1">EINZELKRITIK TOP-4</text>

      <!-- Row 1 -->
      <text x="16" y="49" font-size="12" font-weight="700" fill="#f3f4f6">TW Schwarz (MVP)</text>
      <text x="272" y="49" font-size="12" font-weight="800" fill="#22c55e" text-anchor="end">1,3</text>
      <rect x="16" y="56" width="256" height="8" rx="4" fill="#1a2436" />
      <rect x="16" y="56" width="238" height="8" rx="4" fill="#22c55e" />

      <!-- Row 2 -->
      <text x="16" y="83" font-size="12" font-weight="700" fill="#f3f4f6">#5 (Siegtor 28')</text>
      <text x="272" y="83" font-size="12" font-weight="800" fill="#22c55e" text-anchor="end">1,7</text>
      <rect x="16" y="90" width="256" height="8" rx="4" fill="#1a2436" />
      <rect x="16" y="90" width="225" height="8" rx="4" fill="#22c55e" />

      <!-- Row 3 -->
      <text x="16" y="117" font-size="12" font-weight="700" fill="#f3f4f6">#22 (Assist 23')</text>
      <text x="272" y="117" font-size="12" font-weight="800" fill="#eab308" text-anchor="end">1,9</text>
      <rect x="16" y="124" width="256" height="8" rx="4" fill="#1a2436" />
      <rect x="16" y="124" width="217" height="8" rx="4" fill="#eab308" />

      <!-- Row 4 -->
      <text x="16" y="151" font-size="12" font-weight="700" fill="#f3f4f6">#4 [C] (Abwehrchef)</text>
      <text x="272" y="151" font-size="12" font-weight="800" fill="#eab308" text-anchor="end">2,0</text>
      <rect x="16" y="158" width="256" height="8" rx="4" fill="#1a2436" />
      <rect x="16" y="158" width="212" height="8" rx="4" fill="#eab308" />
    </g>

    <!-- Title Block -->
    <g transform="translate(0 306)">
      <text x="2" y="26" font-size="27" font-weight="800" fill="#ffffff">SV <tspan fill="#eab308">Obersülzen</tspan></text>
      <text x="2" y="48" font-size="13" fill="#9ca3af">Vollständiger Spiel- &amp; Spielerbericht</text>
    </g>
  </g>
</svg>
