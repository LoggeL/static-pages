<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>C12 · Welt und Spieler</title>
  <link rel="icon" href="data:,">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b11;color:#eef1f4;font:13px/1.5 monospace}
    canvas{display:block;width:100%;height:100%;outline:none}
    #panel{position:fixed;left:12px;top:12px;padding:10px 13px;max-width:540px;background:#080c14d9;border:1px solid #71809366;pointer-events:none}
    #metrics{white-space:pre-wrap;margin-top:6px;color:#becbd3}
    #hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:7px 13px;background:#080c14db;text-align:center}
    #crosshair{position:fixed;left:50%;top:50%;width:3px;height:3px;background:#d9e0e0;opacity:.6;pointer-events:none}
    button{font:inherit;color:inherit;background:#202b36;border:1px solid #758393;padding:8px 12px;cursor:pointer}
    #start{position:fixed;right:16px;top:16px}
    .error{color:#ffad9b}
  </style>
  <script type="importmap">
    {"imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
    }}
  </script>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Begehbare Testwelt"></canvas>
  <div id="panel">C12 · Welt und Spieler · ohne Post-FX<div id="metrics">Welt wird geladen …</div></div>
  <button id="start" type="button">Steuerung starten</button>
  <div id="crosshair"></div>
  <div id="hint">WASD · Shift Sprint · Alt Schleichen · C/Strg Ducken · Q/E Lehnen · E Tür · F Prüfleuchte · Esc Maus freigeben</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
