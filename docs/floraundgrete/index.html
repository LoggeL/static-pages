<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flora & Grete · Entwürfe</title>
  <!-- Entwurfsübersicht – nicht für Suchmaschinen gedacht -->
  <meta name="robots" content="noindex" />
  <meta name="description" content="Fünf Website-Entwürfe für Flora & Grete, handgemachte Einzelstücke aus Ramsen (Pfalz)." />
  <meta property="og:title" content="Flora & Grete · Entwürfe" />
  <meta property="og:image" content="https://loggel.github.io/static-pages/floraundgrete/img/preview-leinen.webp" />
  <meta name="theme-color" content="#f4eee6" />
  <link rel="icon" href="img/shop-logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f4eee6; --paper: #fffcf7; --ink: #3a2a22; --muted: #6a5649; --line: #e6d8c6; --rose: #a3485a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 "Source Sans 3", system-ui, sans-serif; }
    img { display: block; max-width: 100%; }
    main { width: min(1240px, 100% - 32px); margin: 0 auto; padding: clamp(32px, 6vw, 72px) 0 56px; }
    header { display: flex; align-items: center; gap: 18px; margin-bottom: clamp(28px, 4vw, 44px); }
    header img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
    h1 { font: 500 clamp(28px, 4vw, 40px)/1.1 Lora, Georgia, serif; margin: 0; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; }
    .card { flex: 0 1 calc((100% - 44px) / 3); min-width: 280px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; text-decoration: none; color: inherit; transition: transform .3s ease, box-shadow .3s ease; }
    .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: 0 18px 40px -20px rgb(58 42 34 / .35); }
    .card:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
    .shot { aspect-ratio: 4 / 5; background: var(--line); overflow: hidden; }
    .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 18px; }
    .meta h2 { font: 500 22px/1.2 Lora, Georgia, serif; margin: 0; }
    .meta span { color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
    @media (max-width: 640px) { .card { flex-basis: 100%; min-width: 0; } .shot { aspect-ratio: 16 / 12; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="img/shop-logo.webp" alt="Logo von Flora & Grete" width="64" height="64" />
      <h1>Flora &amp; Grete · Entwürfe</h1>
    </header>
    <div class="grid">
      <a class="card" href="leinen/"><div class="shot"><img src="img/preview-leinen.webp" alt="Vorschau Entwurf 1, Leinen und Licht" /></div><div class="meta"><h2>Leinen &amp; Licht</h2><span>01</span></div></a>
      <a class="card" href="atelier/"><div class="shot"><img src="img/preview-atelier.webp" alt="Vorschau Entwurf 2, Atelier" /></div><div class="meta"><h2>Atelier</h2><span>02</span></div></a>
      <a class="card" href="lookbook/"><div class="shot"><img src="img/preview-lookbook.webp" alt="Vorschau Entwurf 3, Lookbook" /></div><div class="meta"><h2>Lookbook</h2><span>03</span></div></a>
      <a class="card" href="schnittmuster/"><div class="shot"><img src="img/preview-schnittmuster.webp" alt="Vorschau Entwurf 4, Schnittmuster" /></div><div class="meta"><h2>Schnittmuster</h2><span>04</span></div></a>
      <a class="card" href="nachtatelier/"><div class="shot"><img src="img/preview-nachtatelier.webp" alt="Vorschau Entwurf 5, Nachtatelier" /></div><div class="meta"><h2>Nachtatelier</h2><span>05</span></div></a>
    </div>
  </main>
</body>
</html>
