function resize() {
  const dpr = window.devicePixelRatio || 1;
  const portrait = isTouch && innerHeight > innerWidth;
  document.body.classList.toggle('portrait', portrait);
  const s = portrait ? innerWidth / W : Math.min(innerWidth / W, innerHeight / H);
  const hint = document.getElementById('hint');
  if (hint) hint.style.top = Math.round(H * s + 28) + 'px';
  view.style.width = Math.floor(W * s) + 'px'; view.style.height = Math.floor(H * s) + 'px';
  view.width = Math.floor(W * s * dpr); view.height = Math.floor(H * s * dpr);

function mk(rows) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const make = (flip, white) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch !== '.' && PAL[ch]) {

    return c;
  };

  return rows.map(r => { const px = r.split(' ').map(t => t[0].repeat(+t.slice(1))).join(''), off = Math.floor((w - px.length) / 2);
    return '.'.repeat(off) + px + '.'.repeat(Math.max(0, w - off - px.length)); });
}

}

  camX = (frameN * 0.3) % 600;

  drawBackground(dusk); drawMidground(dusk); drawGround();
  ctx.fillStyle = 'rgba(18,13,28,0.55)'; ctx.fillRect(0, 0, W, H);
  blit();
  text('Jule auf großer', 160, 48, 14, '#f6c35c', 'center');
  text('Drachenjagd', 160, 72, 14, '#f6c35c', 'center');
  if ((frameN >> 5) % 2 === 0) text(isTouch ? 'Tippen zum Starten' : 'Enter drücken zum Starten', 160, 144, 6, '#ffffff', 'center');
  text(isTouch ? '' : 'Pfeile: laufen/springen   X: Captain Kuschel   M: Ton', 160, 162, 4, '#bfb4d6', 'center');
}
function renderEnding() {
  const t = frameN - endFrame;
  for (let i = 0; i < 12; i++) rect(0, i * 15, W, 15, mix('#2a1d4e', '#f59a5d', i / 11));
  for (let i = 0; i < 40; i++) rect(hash(i) * W, hash(i + 50) * 80, 1, 1, '#fff7d8');
  rect(230, 120, 30, 30, '#ffd36a'); rect(226, 126, 38, 18, '#ffd36a');
  for (let sx = 0; sx < W; sx += 2) { const wx = sx + t * 0.6; const hh = 18 + 8 * Math.sin(wx * 0.03) + 5 * Math.sin(wx * 0.07); rect(sx, 160 - hh, 2, 40, '#3a2848'); }
  for (let sx = 0; sx < W; sx += 2) { const wx = sx + t * 1.4; const hh = 8 + 4 * Math.sin(wx * 0.05); rect(sx, 172 - hh, 2, 20, '#21162e'); }
  // alle zusammen in Ramsen
  rect(0, 158, W, 22, '#4a8a3a'); rect(0, 158, W, 2, '#6cc04a');
  const savedCam = camX; camX = 0;
  const hop = (k) => ((t + k * 23) % 90) < 10 ? -3 : 0;
  spr(JAKOB_H, 104, 138 + hop(0), false); spr(JULE.idle, 132, 143 + hop(1), false); spr(BUNNY_MINI, 138, 151 + hop(1), false);
  spr(SEBBI.idle, 158, 135 + hop(2), true); spr(LOGGE.idle, 184, 133 + hop(3), true);
  if ((t >> 3) % 11 === 0) rect(186, 141, 8, 1, '#8fd0f0');
  camX = savedCam;
  if (t % 14 === 0) puff(40 + Math.random() * 240, 20 + Math.random() * 50, ['#ffd36a', '#ff8ab0', '#8fd0f0'][t % 3], 6, 1.2);
  for (const p of parts) rect(p.x, p.y, 1, 1, p.col);
  blit();
  text('ENDE', 160, 16, 14, '#ffe9b0', 'center');
  text('Jakob ist wieder Jakob. Ramsen ist gerettet.', 160, 40, 5, '#f5f1e6', 'center');
  text('Und Logge 2.0 ist jetzt wirklich nett. Vermutlich.', 160, 52, 4, '#bfb4d6', 'center');
  if (t > 60) {
    const secs = Math.round((endFrame - startFrame) / 60);
    text(`Brezeln: ${brezelCount}/${BREZEL_POS.length + FLY_BREZEL_TOTAL}   Zeit: ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}   Versuche: ${deaths + 1}`, 160, 70, 5, '#f6c35c', 'center');
  }
  if (t > 120 && (frameN >> 5) % 2 === 0) text('Enter / Tippen: Zum Titel', 160, 84, 5, '#ffffff', 'center');
}

// ================= Start =================
newGame(); state = 'title';
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
