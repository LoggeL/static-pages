function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (AC.state === 'suspended') AC.resume(); }
function tone(f, d, type = 'square', v = 0.06, f2) {
  if (!AC || muted) return; const t = AC.currentTime; const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}

  const pad = document.getElementById('touch'), BTN_KEYS = ['left', 'right', 'jump', 'hat'];
  const sync = e => {
    e.preventDefault();
    const active = new Set();
    for (const t of e.touches) { const el = document.elementFromPoint(t.clientX, t.clientY); const k = el && el.dataset ? el.dataset.k : null; if (k) active.add(k); }
    for (const k of BTN_KEYS) { if (active.has(k)) press(k); else if (keys[k]) release(k); }
    pad.querySelectorAll('button').forEach(b => b.classList.toggle('on', active.has(b.dataset.k)));
  };
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(ev => pad.addEventListener(ev, sync, { passive: false }));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
}

  if (state === 'title') { if (pressed.ok || pressed.jump) { newGame(); state = 'play';
      say([{ who: null, t: 'Ein ganz normaler Samstag in Ramsen …' },
           { who: null, t: '… bis vom Drachenberg ein gewaltiges BRÜLLEN herüberschallt!', fx: () => SFX.roar() },
           { who: 'jule', t: 'Ein Drache?! Den schau ich mir an. Captain Kuschel, wir gehen auf Drachenjagd!' },
           { who: null, t: isTouch ? 'Steuerung: ◀ ▶ laufen, ▲ springen, Hasen-Knopf wirft Captain Kuschel. Sammle Brezeln!' : 'Pfeiltasten: laufen und springen. X: Captain Kuschel werfen. Sammle unterwegs Brezeln!' }]); }
  } else if (state === 'dialog') { updateDialog(); updateCamera(); if (boss && boss.state === 'intro') updateBoss(); }
  else if (state === 'play') {
    updatePlayer(); updateHat(); updateJule(); updateBunny(); updateEnemies(); updateBrezeln();
    if (boss) updateBoss();
    if (!buddyJoined && P.x > 590) { state = 'bite'; biteT = 0; P.vx = 0; }
    if (!bossStarted && P.x > 2340) startBoss();
    updateCamera();
  } else if (state === 'bite') { updateBite(); }
  else if (state === 'gameover') { if (anyOk()) { spawn(); state = 'play'; } }
  else if (state === 'ending') { if (frameN - endFrame > 120 && anyOk()) state = 'title'; }
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--; }
  parts = (parts || []).filter(p => p.life > 0);
  if (shake > 0) shake--;
  for (const k in pressed) delete pressed[k];
}

// ================= Zeichnen =================
function hexA(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(a, b, t) { const A = hexA(a), B = hexA(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function hash(n) { n = (n << 13) ^ n; return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff; }
function spr(s, x, y, flip, white) { ctx.drawImage(white ? (flip ? s.wf : s.wc) : (flip ? s.f : s.c), Math.round(x - camX), Math.round(y)); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

function drawBackground(dusk) {
  // Himmel in Pixel-Bändern
  const skyTop = mix('#62bdf0', '#2a1d4e', dusk), skyBot = mix('#d8f2ff', '#f08a5d', dusk);
  for (let i = 0; i < 12; i++) rect(0, i * 15, W, 15, mix(skyTop, skyBot, i / 11));
  // Sterne bei Dämmerung
  if (dusk > 0.4) for (let i = 0; i < 30; i++) { if ((frameN >> 4) % 7 !== i % 7) rect((hash(i) * 340 - camX * 0.02 + 340) % 320, hash(i + 99) * 70, 1, 1, `rgba(255,255,230,${(dusk - 0.4) * 1.6})`); }
  // Wolken
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 97 + frameN * 0.04 - camX * 0.06) % 420 + 420) % 420 - 60, cy = 12 + (i * 23) % 44;
    const col = mix('#ffffff', '#f3b2a0', dusk);
    rect(cx, cy, 30, 6, col); rect(cx + 6, cy - 4, 14, 4, col); rect(cx + 18, cy - 2, 8, 2, col);
  }
  // Drachenberg in der Ferne
  const px = 330 - camX * 0.1;
  const mcol = mix('#7d6f9e', '#3a2648', dusk);
  for (let y = 36; y < 150; y += 2) { const hw = (y - 36) * 0.85; rect(px - hw, y, hw * 2, 2, mcol); }
  rect(px - 4, 36, 8, 2, '#ff6a3a'); rect(px - 2, 34, 4, 2, '#ffb15a');
  for (let i = 0; i < 4; i++) { const t = ((frameN * 0.4 + i * 30) % 120); rect(px - 4 + Math.sin(t * 0.1 + i) * 4 + t * 0.15, 30 - t * 0.3, 6 - t * 0.03, 5 - t * 0.03, `rgba(90,80,100,${1 - t / 120})`); }
  // Ferne Berge
  const fcol = mix('#9db5d6', '#5a4a7a', dusk);
  for (let sx = 0; sx < W; sx += 2) { const wx = sx + camX * 0.2; const hh = 26 + 12 * Math.sin(wx * 0.02) + 8 * Math.sin(wx * 0.047 + 2); rect(sx, 132 - hh, 2, H - 132 + hh, fcol); }
  // Hügel: Weinberge → Wald → Fels
  for (let sx = 0; sx < W; sx += 2) {
    const wx = sx + camX * 0.4, top = 120 + 5 * Math.sin(wx * 0.03) + 3 * Math.sin(wx * 0.011);
    const biome = wx < 420 ? 0 : wx < 760 ? 1 : 2;
    const col = biome === 0 ? mix('#78b85a', '#4a6b48', dusk) : biome === 1 ? mix('#3e7d4a', '#2c4a3e', dusk) : mix('#7a6662', '#4a3644', dusk);
    rect(sx, top, 2, H - top, col);
    if (biome === 0) for (let ry = top + 4; ry < 150; ry += 5) if (((wx | 0) >> 1) % 3 === 0) rect(sx, ry, 2, 2, mix('#3f7a34', '#2c4a2e', dusk));
  }
}
function layerX(anchor, f) { return 160 + (anchor - camX - 160) * f; }
function drawMidground(dusk) {
  // Fachwerkhäuser (Dorf)
  for (const [ax, hw, hh, roof] of [[70, 34, 24, '#b5423a'], [210, 30, 28, '#a8483e'], [350, 38, 22, '#b5423a'], [500, 30, 26, '#9a3d36'], [700, 28, 22, '#b5423a']]) {
    const x = Math.round(layerX(ax, 0.7)); if (x < -60 || x > W + 20) continue;
    const by = 146; rect(x, by - hh, hw, hh, '#efe6d2');
    rect(x, by - hh, hw, 2, '#5b3a22'); rect(x, by - hh / 2, hw, 2, '#5b3a22'); rect(x, by - hh, 2, hh, '#5b3a22'); rect(x + hw - 2, by - hh, 2, hh, '#5b3a22'); rect(x + (hw >> 1), by - hh, 2, hh, '#5b3a22');
    for (let i = 0; i < 4; i++) rect(x + 4 + i * 2, by - hh + 3 + i * 2, 2, 2, '#5b3a22');
    rect(x + 5, by - 9, 6, 9, '#6a4428'); rect(x + hw - 11, by - hh + 5, 6, 6, '#8fd0f0'); rect(x + hw - 11, by - hh + 8, 6, 1, '#5b3a22');
    for (let r = 0; r < 12; r++) rect(x - 3 + r, by - hh - 1 - r, hw + 6 - r * 2, 1, roof);
    if (dusk > 0.2) rect(x + hw - 11, by - hh + 5, 6, 6, '#ffd36a');
  }
  // Kirchturm
  { const x = Math.round(layerX(420, 0.7)); if (x > -30 && x < W + 30) { rect(x, 96, 14, 50, '#e8dcc4'); for (let r = 0; r < 20; r++) rect(x + 7 - r * 0.4, 96 - 20 + r, Math.max(1, r * 0.8), 1, '#4b4a5e'); rect(x + 4, 104, 6, 8, '#3a2b2b'); rect(x + 6, 68, 2, 8, '#d9b44a'); rect(x + 4, 70, 6, 2, '#d9b44a'); } }
  // Tannen (Wald)
  for (let ax = 1050; ax < 1980; ax += 42) {
    const x = Math.round(layerX(ax + hash(ax) * 20, 0.75)); if (x < -30 || x > W + 30) continue;
    const hgt = 34 + hash(ax + 7) * 22, col = mix('#2f6a3e', '#20403a', dusk);
    rect(x + 6, 146 - 8, 4, 8, '#4a3020');
    for (let r = 0; r < hgt; r++) { const ww = Math.round((r % 12) * 0.9 + r * 0.22) + 1; rect(x + 8 - ww, 146 - 8 - hgt + r, ww * 2, 1, col); }
  }
  // Felsen & Lava (Drachenberg)
  for (let ax = 1900; ax < 2800; ax += 48) {
    const x = Math.round(layerX(ax + hash(ax) * 24, 0.7)); if (x < -40 || x > W + 40) continue;
    const hgt = 30 + hash(ax + 3) * 40, wd = 16 + hash(ax + 5) * 14, col = mix('#5e4a52', '#3a2a3a', dusk);
    for (let r = 0; r < hgt; r += 2) { const ww = wd * (r / hgt) + 2; rect(x - ww / 2, 148 - hgt + r, ww, 2, col); }
    if (hash(ax) > 0.5) { const ly = 148 - hgt * 0.4; rect(x - 1, ly, 2, 6, '#ff6a2a'); rect(x, ly + 6, 2, 4, '#ff6a2a'); }
  }
}
function drawGround() {
  for (const [a, b] of GROUNDS) {
    const x0 = Math.max(a, camX - 2), x1 = Math.min(b, camX + W + 2); if (x1 <= x0) continue;
    for (let wx = Math.floor(x0 / 4) * 4; wx < x1; wx += 4) {
      const biome = wx < 1100 ? 0 : wx < 1900 ? 1 : 2;
      const sx = wx - camX;
      const dirt = biome === 2 ? '#5b4a4e' : '#7a5232', dirt2 = biome === 2 ? '#463840' : '#5e3e26';
      const top = biome === 0 ? '#6cc04a' : biome === 1 ? '#4a9a46' : '#8a7a78', top2 = biome === 0 ? '#3f8a36' : biome === 1 ? '#2f6e36' : '#6a5a5a';
      const cw = Math.min(4, x1 - wx);
      rect(sx, GROUND_Y, cw, 30, dirt);
      rect(sx, GROUND_Y, cw, 3, top); rect(sx, GROUND_Y + 3, cw, 2, top2);
      const hh = hash(wx);
      if (hh > 0.55) rect(sx + (hh * 3 | 0), GROUND_Y + 8 + ((hh * 97 | 0) % 18), 2, 1, dirt2);
      if (hash(wx + 5) > 0.7) rect(sx + 1, GROUND_Y + 12 + ((hash(wx + 9) * 13) | 0), 1, 1, dirt2);
      if (biome < 2 && hh > 0.82) { rect(sx + 1, GROUND_Y - 2, 1, 2, top2); rect(sx + 2, GROUND_Y - 1, 1, 1, top2); }
      if (biome === 0 && hash(wx + 1) > 0.9) { rect(sx + 1, GROUND_Y - 3, 1, 3, '#3f8a36'); rect(sx, GROUND_Y - 4, 3, 1, ['#ffd84a', '#ff8ab0', '#ffffff'][(hh * 30 | 0) % 3]); }
      if (biome === 2 && hash(wx + 2) > 0.93) rect(sx, GROUND_Y + 6, 3, 1, '#ff6a2a');
    }
    // Kanten
    if (a > 0) rect(a - camX, GROUND_Y, 1, 30, '#2a1a14');
    if (b < LEVEL_END) rect(b - camX - 1, GROUND_Y, 1, 30, '#2a1a14');
  }
  for (const [px, py, pw] of PLATS) {
    const stone = px > 1900, sx = px - camX;
    rect(sx, py, pw, 6, stone ? '#7a6a6a' : '#9a6a3a'); rect(sx, py, pw, 2, stone ? '#a09090' : '#c98a4b');
    rect(sx, py + 5, pw, 1, '#2a1a14');
    for (let i = 6; i < pw; i += 8) rect(sx + i, py + 2, 1, 3, stone ? '#5a4a4a' : '#6b4426');
  }
}

function drawPlayer() { // Jule
  const p = P; if (p.inv > 0 && (frameN >> 2) % 2 === 0) return;
  let f = 'idle';
  if (!p.onGround) f = 'jump'; else if (Math.abs(p.vx) > 0.2) f = ((p.anim | 0) % 2) ? 'w1' : 'w2';
  spr(JULE[f], p.x - 3, p.y, p.face < 0);
  if (!hat) spr(BUNNY_MINI, p.x + (p.face > 0 ? 3 : 0), p.y + 8, p.face < 0);
}
function drawBuddy() { // Logge
  let f = 'idle';
  if (buddyJoined && J.air) f = 'jump'; else if (J.moving) f = ((J.anim | 0) % 2) ? 'w1' : 'w2';
  const set = (J.hasBunny && !bunny) ? LOGGE : LOGGE_NH;
  const hop = !buddyJoined && (frameN % 140) > 120 ? -2 : 0; // wartet und wippt ungeduldig
  const ouch = J.flash > 0, jump = J.flash > 18 ? -3 : 0;
  spr(set[f], J.x - 2 + (ouch ? (frameN % 4 < 2 ? -1 : 1) : 0), J.y - 5 + hop + jump, J.face < 0, ouch && (J.flash >> 2) % 2 === 0);
}
function drawDragon() {
  const b = boss; if (!b) return;
  const flying = b.state !== 'rest' && !(b.state === 'defeated' && b.y >= GROUND_Y - 26);
  const open = b.mouth > 0 || b.state === 'warn';
  const body = flying ? (open ? DRAGON.flyOpen : DRAGON.fly) : (open ? DRAGON.standOpen : DRAGON.stand);
  const flip = b.face > 0, white = b.flash > 0 && (b.flash >> 1) % 2 === 0;
  const wingUp = flying ? ((frameN >> 3) % 2 === 0) : true;
  const wing = wingUp ? DRAGON.wingUp : DRAGON.wingDown;
  const wy = wingUp ? b.y + 1 : b.y + 10;
  const wx = flip ? b.x + 36 - 17 - wing.w : b.x + 17;
  if (b.state === 'warn' && (frameN >> 2) % 2 === 0) { spr(body, b.x, b.y, flip, true); spr(wing, wx, wy, flip, true); return; }
  spr(body, b.x, b.y, flip, white); spr(wing, wx, wy, flip, white);
  if (b.state === 'rest' || (b.state === 'defeated' && b.t > 60)) {
    for (let i = 0; i < 3; i++) { const a = frameN * 0.1 + i * 2.1; rect(b.x + 8 + Math.cos(a) * 9 - camX, b.y - 4 + Math.sin(a) * 3, 2, 2, '#ffe066'); }
  }
}
function drawWorld() {
  const dusk = Math.max(0, Math.min(1, (camX - 900) / 1300));
  drawBackground(dusk); drawMidground(dusk);
  for (const [x, label] of SIGNS) { const w = label.length * 3 + 6, sx = x - camX;
    rect(sx + w / 2 - 1, GROUND_Y - 6, 2, 6, '#5b3a22'); rect(sx, GROUND_Y - 13, w, 8, '#1b1424'); rect(sx + 1, GROUND_Y - 12, w - 2, 6, '#c98a4b'); }
  drawGround();
  for (const b of brezeln) if (!b.taken) spr(BREZEL, b.x, b.y + Math.round(Math.sin(frameN * 0.07 + b.x) * 1.5));
  for (const en of enemies) if (en.alive) {
    if (en.type === 'beetle') spr(BEETLE[((en.t || 0) >> 3) % 2], en.x, en.y, en.vx > 0);
    else spr(BAT[(frameN >> 3) % 2], en.x, en.y);
  }
  drawDragon();
  drawBuddy();
  if (bunny) spr(HAT[(bunny.spin >> 2) % 4], bunny.x, bunny.y);
  drawPlayer();
  if (hat) spr(BUNNY, hat.x, hat.y + ((hat.t >> 2) % 2), (hat.t >> 3) % 2 === 0);
  for (const f of fireballs) spr(FIRE[(f.t >> 2) % 2], f.x, f.y);
  for (const w of waves) { rect(w.x - camX, GROUND_Y - 6, 8, 6, '#d9b38c'); rect(w.x - camX + 2, GROUND_Y - 9, 4, 3, '#efd2a8'); }
  for (const p of parts) rect(p.x - camX, p.y, 2, 2, p.col);
}
function drawHUD() {
  for (let i = 0; i < 3; i++) ctx.drawImage(i < P.hp ? HEART.c : HEART_E.c, 4 + i * 9, 4);
  ctx.drawImage(BREZEL.c, 4, 13);
  if (boss && bossStarted && boss.state !== 'intro') {
    rect(100, 5, 120, 6, '#1b1424'); rect(101, 6, 118, 4, '#4a2a3a'); rect(101, 6, Math.round(118 * boss.hp / boss.max), 4, '#6ad25a');
  }
}
function drawBox(x, y, w, h) { rect(x, y, w, h, '#1b1424'); rect(x + 1, y + 1, w - 2, h - 2, '#f5f1e6'); rect(x + 2, y + 2, w - 4, h - 4, '#2b2140'); }
function drawPortrait(who, x, y) {
  rect(x - 1, y - 1, 58, 58, '#f5f1e6');
  const im = who === 'drache' ? DRAGON_PORTRAIT : PORTRAIT[who];
  if (im) ctx.drawImage(im, x, y, 56, 56);
}

// --- Text (auf der hochauflösenden Ebene) ---
function font(sz) { return `${Math.round(sz * U)}px "Press Start 2P", monospace`; }
function text(str, x, y, sz = 6, col = '#f5f1e6', align = 'left', shadow = true) {
  vctx.font = font(sz); vctx.textAlign = align; vctx.textBaseline = 'top';
  if (shadow) { vctx.fillStyle = '#1b1424'; vctx.fillText(str, Math.round((x + 0.7) * U), Math.round((y + 0.7) * U)); }
  vctx.fillStyle = col; vctx.fillText(str, Math.round(x * U), Math.round(y * U));
}
function wrap(str, maxW, sz) {
  vctx.font = font(sz); const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (vctx.measureText(t).width / U > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function drawDialogText() {
  const L = dialog.lines[dialog.i]; const hasP = !!L.who;
  const tx = hasP ? 70 : 12, maxW = hasP ? 240 : 296;
  if (hasP) text(NAMES[L.who], tx, 9, 6, NAME_COL[L.who]);
  const lines = wrap(L.t.slice(0, Math.floor(dialog.n)), maxW, 6);
  lines.forEach((ln, i) => text(ln, tx, (hasP ? 21 : 16) + i * 10, 6));
}
function blit() {
  vctx.imageSmoothingEnabled = false;
  const sx = shake > 0 ? (Math.random() - 0.5) * shake * 0.6 : 0, sy = shake > 0 ? (Math.random() - 0.5) * shake * 0.6 : 0;
  vctx.fillStyle = '#120d1c'; vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(buf, Math.round(sx * U), Math.round(sy * U), view.width, view.height);
}

function render() {
  if (state === 'title') return renderTitle();
  if (state === 'ending') return renderEnding();
  drawWorld(); if (state !== 'dialog') drawHUD();
  if (state === 'dialog') {
    const L = dialog.lines[dialog.i];
    drawBox(4, 4, 312, 64);
    if (L.who) drawPortrait(L.who, 9, 8);
    if (dialog.n >= L.t.length && (frameN >> 4) % 2 === 0) { rect(304, 58, 7, 2, '#f6c35c'); rect(305, 60, 5, 1, '#f6c35c'); rect(306, 61, 3, 1, '#f6c35c'); rect(307, 62, 1, 1, '#f6c35c'); }
  }
  if (state === 'gameover') { ctx.fillStyle = 'rgba(20,10,30,0.7)'; ctx.fillRect(0, 0, W, H); }
  blit();
  if (state !== 'dialog') for (const [x, label] of SIGNS) { const sx = x - camX; if (sx > -60 && sx < W + 10) { text(label, sx + 3.4, GROUND_Y - 10.6, 3, '#2a1a10', 'left', false); } }
  if (state !== 'dialog') text('x' + brezelCount, 15, 14, 5);
  if (state !== 'dialog' && boss && bossStarted && boss.state !== 'intro') text('JAKOBUS DER SCHRECKLICHE', 160, 13, 4, '#ffe9b0', 'center');
  if (muted) text('Ton aus', 316, 4, 4, '#ffffff', 'right');
  if (state === 'bite' && biteT >= 50 && biteT < 112) text('*HAPS*', J.x - camX + 4, J.y - 22 - (biteT - 50) * 0.12, 6, '#ff8a8a', 'center');
  if (state === 'dialog') drawDialogText();
  if (state === 'gameover') {
    text('AUTSCH!', 160, 60, 12, '#ff7a7a', 'center');
    text('Jule braucht eine Pause.', 160, 86, 6, '#f5f1e6', 'center');
    if ((frameN >> 5) % 2 === 0) text('Enter / Tippen: Nochmal!', 160, 108, 6, '#f6c35c', 'center');
  }
}
function renderTitle() {
  camX = (frameN * 0.3) % 600;
  const dusk = 0;
  drawBackground(dusk); drawMidground(dusk); drawGround();
  ctx.fillStyle = 'rgba(18,13,28,0.55)'; ctx.fillRect(0, 0, W, H);
  blit();
  text('Jule auf großer', 160, 48, 14, '#f6c35c', 'center');
  text('Drachenjagd', 160, 72, 14, '#f6c35c', 'center');
  if ((frameN >> 5) % 2 === 0) text(isTouch ? 'Tippen zum Starten' : 'Enter drücken zum Starten', 160, 144, 6, '#ffffff', 'center');
  text(isTouch ? '' : 'Pfeile: laufen/springen   X: Captain Kuschel   M: Ton', 160, 162, 4, '#bfb4d6', 'center');
}
function renderEnding() {
  const t = frameN - endFrame;
  for (let i = 0; i < 12; i++) rect(0, i * 15, W, 15, mix('#2a1d4e', '#f59a5d', i / 11));
  for (let i = 0; i < 40; i++) rect(hash(i) * W, hash(i + 50) * 80, 1, 1, '#fff7d8');
  rect(230, 120, 30, 30, '#ffd36a'); rect(226, 126, 38, 18, '#ffd36a');
  for (let sx = 0; sx < W; sx += 2) { const wx = sx + t * 0.6; const hh = 18 + 8 * Math.sin(wx * 0.03) + 5 * Math.sin(wx * 0.07); rect(sx, 160 - hh, 2, 40, '#3a2848'); }
  for (let sx = 0; sx < W; sx += 2) { const wx = sx + t * 1.4; const hh = 8 + 4 * Math.sin(wx * 0.05); rect(sx, 172 - hh, 2, 20, '#21162e'); }
  // Drache mit Logge & Jule auf dem Rücken
  const dx = Math.min(140, -60 + t * 1.2), dy = 70 + Math.sin(t * 0.06) * 6;
  const savedCam = camX; camX = 0;
  spr(LOGGE.idle, dx + 3, dy - 11, false); spr(JULE.idle, dx + 15, dy - 3, false); spr(BUNNY_MINI, dx + 21, dy + 5, false);
  spr(DRAGON.fly, dx, dy, true);
  const wing = (t >> 3) % 2 ? DRAGON.wingUp : DRAGON.wingDown; spr(wing, dx + 36 - 17 - wing.w, (t >> 3) % 2 ? dy + 1 : dy + 10, true);
  camX = savedCam;
  if (t % 6 === 0) puff(dx + 2, dy + 20, '#ffd27a', 1, 0.4);
  for (const p of parts) rect(p.x, p.y, 1, 1, p.col);
  blit();
  text('ENDE', 160, 16, 14, '#ffe9b0', 'center');
  text('Jule, Logge & Jakob fliegen heim nach Ramsen.', 160, 40, 5, '#f5f1e6', 'center');
  if (t > 60) {
    const secs = Math.round((endFrame - startFrame) / 60);
    text(`Brezeln: ${brezelCount}/${BREZEL_POS.length}   Zeit: ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}   Versuche: ${deaths + 1}`, 160, 136, 5, '#f6c35c', 'center');
  }
  if (t > 120 && (frameN >> 5) % 2 === 0) text('Enter / Tippen: Zum Titel', 160, 150, 5, '#ffffff', 'center');
}

// ================= Start =================
newGame(); state = 'title';
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
