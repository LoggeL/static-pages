<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texturen-Prüfstand</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #ddd; font: 12px/1.3 system-ui, sans-serif; overflow: hidden; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translate(-50%, 0); background: rgba(0,0,0,.55); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  #info { position: fixed; left: 8px; bottom: 6px; opacity: .7; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="labels"></div>
<div id="info">?view=grid | one&amp;id=&lt;id&gt; | decals · &amp;t=&lt;Sekunden&gt; Lichtposition</div>
<script type="module">
import * as THREE from 'three';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'grid';
const BASE = '../../textures/';
const index = await (await fetch(BASE + 'index.json')).json();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.02, 200);
const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
let pending = 0;
function tex(url, srgb) {
  pending++;
  const t = loader.load(url, () => { pending--; }, undefined, () => { pending--; console.error('missing', url); });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const matCache = {};
function material(id) {
  if (matCache[id]) return matCache[id];
  const d = BASE + id + '/';
  const files = index[id].files;
  const orm = tex(d + files.orm);
  const m = new THREE.MeshStandardMaterial({
    map: tex(d + files.albedo, true), normalMap: tex(d + files.normal),
    aoMap: orm, roughnessMap: orm, metalnessMap: orm, roughness: 1, metalness: 1,
  });
  m.userData.tile = index[id].tileMeters;
  return (matCache[id] = m);
}
// UVs in Weltmetern -> repeat = 1/tileMeters (wie die Engine)
function worldUV(geo, w, h) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w, uv.getY(i) * h);
  return geo;
}
function setRepeat(m) {
  for (const k of ['map', 'normalMap', 'aoMap']) if (m[k]) m[k].repeat.set(1 / m.userData.tile, 1 / m.userData.tile);
}
const labels = [];
function label(text, pos) { const el = document.createElement('div'); el.textContent = text; document.getElementById('labels').appendChild(el); labels.push({ el, pos }); }

const T = parseFloat(q.get('t') || '0');
let animate = () => {};
scene.add(new THREE.HemisphereLight(0x8090a0, 0x202020, 0.12));

if (view === 'grid') {
  const ids = Object.keys(index).filter(k => k !== 'decals');
  const cols = 6, sp = 1.9;
  ids.forEach((id, i) => {
    const cx = (i % cols - (cols - 1) / 2) * sp, cy = -(Math.floor(i / cols) - (Math.ceil(ids.length / cols) - 1) / 2) * sp;
    const m = material(id); setRepeat(m);
    const g = worldUV(new THREE.PlaneGeometry(1.6, 1.6), 1.6, 1.6);
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(cx, cy, 0);
    scene.add(mesh);
    const l = new THREE.PointLight(0xfff1e0, 2.2, 6, 2);
    l.position.set(cx - 0.6, cy + 0.6, 0.55);
    scene.add(l);
    label(id + ' · ' + index[id].tileMeters + ' m', new THREE.Vector3(cx, cy - 0.82, 0));
  });
  camera.position.set(0, 0, 9.6);
  camera.lookAt(0, 0, 0);
} else if (view === 'one') {
  const id = q.get('id') || 'wood_floor_worn';
  const floorId = q.get('floor') || id, wallId = q.get('wall') || id;
  const fm = material(floorId), wm = material(wallId); setRepeat(fm); setRepeat(wm);
  const floor = new THREE.Mesh(worldUV(new THREE.PlaneGeometry(6, 6), 6, 6), fm);
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const wall = new THREE.Mesh(worldUV(new THREE.PlaneGeometry(6, 2.6), 6, 2.6), wm);
  wall.position.set(0, 1.3, -2.5); scene.add(wall);
  // Waffenlicht-artiger Spot von der Kamera + schwaches Raumlicht
  const spot = new THREE.SpotLight(0xf4f7ff, 30, 15, 0.42, 0.55, 2);
  scene.add(spot, spot.target);
  window._dbg = { wall, floor, spot };
  const pl = new THREE.PointLight(0xffd9a8, 6, 10, 2); pl.position.set(-2.2, 2.3, 0.5); scene.add(pl);
  camera.position.set(0.6, 1.45, 2.4);
  camera.lookAt(-0.2, 0.7, -2.2);
  const look = (t) => {
    spot.position.copy(camera.position).add(new THREE.Vector3(0.15, -0.25, 0));
    spot.target.position.set(Math.sin(t * 0.6) * 1.4, 0.6 + Math.cos(t * 0.4) * 0.5, -2.3);
  };
  look(T);
  animate = (t) => look(T + t);
  label('Boden: ' + floorId + '  ·  Wand: ' + wallId, new THREE.Vector3(0, 2.75, -2.5));
} else if (view === 'rake') {
  // Streiflicht: zeigt Normal Map / Relief. Mehrere ids nebeneinander (?ids=a,b,c)
  const ids = (q.get('ids') || 'plaster_damaged').split(',');
  const sp = 1.15;
  ids.forEach((id, i) => {
    const m = material(id); setRepeat(m);
    const mesh = new THREE.Mesh(worldUV(new THREE.PlaneGeometry(1.0, 1.0), 1.0, 1.0), m);
    const x = (i - (ids.length - 1) / 2) * sp;
    mesh.position.set(x, 0, 0); scene.add(mesh);
    const l = new THREE.PointLight(0xffffff, 3.0, 1.3, 1.0);
    l.position.set(x - 0.56, 0.3, 0.05); scene.add(l);
    label(id, new THREE.Vector3(x, -0.56, 0));
  });
  camera.position.set(0, 0, 0.62 * ids.length + 0.6); camera.lookAt(0, 0, 0);
} else if (view === 'decals') {
  const dec = index.decals;
  const wall = new THREE.Mesh(worldUV(new THREE.PlaneGeometry(7, 2.6), 7, 2.6), material(q.get('wall') || 'plaster_painted_dirty'));
  setRepeat(wall.material); wall.position.set(0, 1.3, -1.5); scene.add(wall);
  const floor = new THREE.Mesh(worldUV(new THREE.PlaneGeometry(7, 4), 7, 4), material(q.get('floor') || 'wood_floor_worn'));
  setRepeat(floor.material); floor.rotation.x = -Math.PI / 2; floor.position.z = 0.5; scene.add(floor);
  const ceil = null;
  const dmat = (id) => {
    const e = dec[id];
    const m = new THREE.MeshStandardMaterial({ map: tex(BASE + e.file, true), transparent: true, depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -4, roughness: e.roughness, metalness: e.metalness });
    m.map.wrapS = m.map.wrapT = THREE.ClampToEdgeWrapping;
    if (e.normal) { m.normalMap = tex(BASE + e.normal); m.normalMap.wrapS = m.normalMap.wrapT = THREE.ClampToEdgeWrapping; }
    return m;
  };
  const put = (id, mesh, pos, rotZ = 0, scale = 1) => {
    const s = dec[id].sizeMeters * scale;
    const n = mesh === floor ? new THREE.Euler(-Math.PI / 2, 0, rotZ) : new THREE.Euler(0, 0, rotZ);
    const g = new DecalGeometry(mesh, pos, n, new THREE.Vector3(s, s, 0.3));
    const d = new THREE.Mesh(g, dmat(id)); scene.add(d);
  };
  scene.updateMatrixWorld(true);
  const W = (x, y) => new THREE.Vector3(x, y, -1.5);
  const F = (x, z) => new THREE.Vector3(x, 0, z);
  put('water_stain', wall, W(-2.4, 2.0));
  put('graffiti_1', wall, W(1.6, 1.55));
  put('graffiti_2', wall, W(-0.4, 1.1), 0, 0.8);
  put('grime_corner', wall, W(-3.1, 0.38));
  put('mold_patch', wall, W(2.9, 2.2));
  put('blood_splatter', wall, W(0.4, 1.7));
  ['bullet_hole_plaster', 'bullet_hole_plaster', 'bullet_hole_concrete', 'bullet_hole_wood', 'bullet_hole_metal'].forEach((id, i) =>
    put(id, wall, W(-1.6 + i * 0.22, 1.35 + (i % 2) * 0.12), i * 1.3));
  put('footprints_mud', floor, F(0.6, 0.3), 0.4);
  put('papers_scattered', floor, F(-1.4, 0.4), 1.0);
  const spot = new THREE.SpotLight(0xf4f7ff, 30, 15, 0.5, 0.5, 2);
  scene.add(spot, spot.target);
  const pl = new THREE.PointLight(0xffd9a8, 2.0, 9, 2); pl.position.set(2.5, 2.3, 0.8); scene.add(pl);
  camera.position.set(0, 1.5, 3.2);
  camera.lookAt(0, 1.0, -1.5);
  const look = (t) => { spot.position.set(0.2, 1.3, 3.0); spot.target.position.set(Math.sin(t * 0.5) * 1.6, 1.2, -1.5); };
  look(T); animate = (t) => look(T + t);
  if (q.get('close')) { camera.position.set(-1.15, 1.42, -0.95); camera.lookAt(-1.15, 1.42, -1.5); camera.fov = 40; camera.updateProjectionMatrix(); spot.position.set(-0.7, 1.75, -0.7); spot.intensity = 2.5; spot.target.position.set(-1.2, 1.4, -1.5); pl.intensity = 0.3; animate = () => {}; }
}

window._cam = camera; window._scene = scene;
const v = new THREE.Vector3();
const clock = new THREE.Clock();
function frame() {
  animate(clock.getElapsedTime());
  renderer.render(scene, camera);
  for (const l of labels) {
    v.copy(l.pos).project(camera);
    l.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
    l.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
  }
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const iv = setInterval(() => { if (pending === 0) { console.log('textures loaded'); clearInterval(iv); } }, 200);
</script>
</body>
</html>
