<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>C6 · Lightmaps</title>
  <link rel="icon" href="data:,">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151e;color:#e9eef1;font:12px/1.45 monospace}
    canvas{display:block;width:100%;height:100%;outline:none}
    #panel{position:fixed;left:12px;top:12px;max-width:min(480px,calc(100vw - 48px));padding:10px 12px;background:#111820e8;border:1px solid #53616c;border-radius:3px}
    summary{cursor:pointer;font-size:14px}
    label{display:inline-flex;align-items:center;gap:5px;margin:7px 10px 0 0}
    select,button,input{font:inherit;color:inherit;background:#25303a;border:1px solid #647583;border-radius:2px;padding:4px 6px}
    input[type=number]{width:55px}input[type=checkbox]{accent-color:#94c5df}
    button{cursor:pointer}#metrics{white-space:pre-wrap;margin:8px 0 0;color:#c2cdd3}
    #error{color:#ffad9b;white-space:pre-wrap}#hint{position:fixed;bottom:8px;left:12px;right:12px;color:#c4cfd7;pointer-events:none;text-shadow:0 1px 3px #000}
    .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px}.sr{position:absolute;clip-path:inset(100%)}
  </style>
  <script type="importmap">
    {"imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }}
  </script>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Lightmap-Testwelt, frei bewegliche Kamera"></canvas>
  <details id="panel" open>
    <summary>C6 · Lightmap-Prüfung</summary>
    <label>Ansicht <select id="preset" aria-label="Kameraposition"></select></label>
    <label>Modus <select id="mode">
      <option value="baked">Material + Bake</option><option value="lighting">Nur Lichtkarte</option>
      <option value="atlases">Atlas-Zuordnung</option><option value="unlit">Unbeleuchtetes Material</option>
    </select></label>
    <label><input id="inspection" type="checkbox">Prüfleuchte</label>
    <label><input id="collision" type="checkbox">Kollider</label>
    <label><input id="fog" type="checkbox" checked>Nebel</label>
    <label>Belichtung <input id="exposure" type="number" value="1" min="0.01" max="64" step="0.25"></label>
    <div class="row"><label>Tür <select id="door" aria-label="Tür auswählen"></select></label>
      <button id="door-toggle" type="button">Öffnen / schließen</button></div>
    <div class="row"><button id="start" type="button">Kamera steuern</button><button id="copy" type="button">Kamera-URL kopieren</button></div>
    <div id="metrics" role="status">Lade Szene …</div><div id="error" role="alert"></div>
  </details>
  <div id="hint">Freie Kamera ohne Kollision · WASD · Leertaste auf · C ab · Shift schnell · Maus Blick · F Prüfleuchte · Esc freigeben</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
